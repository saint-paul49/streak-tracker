<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7fb" />
  <title>Мои серии</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#17181c;
      --muted:#777b86;
      --line:#e8eaf0;
      --shadow:0 10px 30px rgba(24,31,50,.07);
      --radius:24px;
    }

    *{box-sizing:border-box}
    html{-webkit-tap-highlight-color:transparent}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), transparent 34%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
    }

    .app{
      width:min(820px,100%);
      margin:0 auto;
      padding:24px 16px 42px;
    }

    .header{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;
      margin:4px 4px 22px;
    }

    .eyebrow{
      font-size:13px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#9195a0;
      margin-bottom:7px;
    }

    h1{
      margin:0;
      font-size:clamp(30px,7vw,48px);
      line-height:.95;
      letter-spacing:-.045em;
    }

    .today{
      text-align:right;
      color:var(--muted);
      font-weight:700;
      font-size:14px;
      white-space:nowrap;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-bottom:14px;
    }

    .summary-box{
      background:rgba(255,255,255,.74);
      border:1px solid rgba(255,255,255,.8);
      backdrop-filter:blur(10px);
      border-radius:18px;
      padding:14px 12px;
      box-shadow:0 6px 22px rgba(24,31,50,.04);
      text-align:center;
    }

    .summary-num{
      font-size:24px;
      font-weight:900;
      letter-spacing:-.04em;
    }

    .summary-label{
      margin-top:3px;
      font-size:11px;
      color:var(--muted);
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.07em;
    }

    .list{
      display:grid;
      gap:12px;
    }

    .habit{
      --full:#4caf50;
      --accent:#d7d7dc;
      position:relative;
      overflow:hidden;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
      transition:transform .18s ease, border-color .2s ease, background .2s ease;
    }

    .habit.active{
      border-color:color-mix(in srgb, var(--accent) 28%, #e5e7ed);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 5%, white), #fff 56%);
    }

    .habit:active{
      transform:scale(.995);
    }

    .top-row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
    }

    .title-wrap{
      min-width:0;
    }

    .habit-title{
      display:flex;
      align-items:center;
      gap:9px;
      font-size:19px;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .dot{
      width:11px;
      height:11px;
      flex:0 0 auto;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 15%, transparent);
    }

    .meta{
      margin-top:5px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }

    .streak{
      text-align:right;
      flex:0 0 auto;
    }

    .streak-num{
      font-size:29px;
      line-height:1;
      font-weight:950;
      letter-spacing:-.055em;
      color:var(--accent);
    }

    .streak-label{
      margin-top:4px;
      color:var(--muted);
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .bar-track{
      height:13px;
      margin-top:17px;
      border-radius:999px;
      background:#edeef2;
      overflow:hidden;
    }

    .bar{
      height:100%;
      width:0%;
      border-radius:inherit;
      background:linear-gradient(90deg,
        color-mix(in srgb, var(--accent) 78%, white),
        var(--accent));
      box-shadow:0 0 16px color-mix(in srgb, var(--accent) 25%, transparent);
      transition:width .35s cubic-bezier(.2,.7,.2,1), background .3s ease;
    }

    .below{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-top:14px;
    }

    .badges{
      min-height:31px;
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }

    .badge{
      display:inline-grid;
      place-items:center;
      width:31px;
      height:31px;
      border-radius:10px;
      background:#f0f1f4;
      filter:grayscale(1);
      opacity:.28;
      font-size:18px;
      transition:.2s ease;
    }

    .badge.on{
      background:color-mix(in srgb, var(--accent) 10%, white);
      filter:none;
      opacity:1;
      transform:translateY(-1px);
    }

    .actions{
      display:flex;
      gap:8px;
      flex:0 0 auto;
    }

    button{
      border:0;
      font:inherit;
      cursor:pointer;
    }

    .mark{
      width:46px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      font-size:21px;
      font-weight:900;
      background:#f1f2f5;
      color:#91949c;
      transition:transform .12s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
    }

    .mark:active{
      transform:scale(.92);
    }

    .mark.fail.selected{
      color:#fff;
      background:#8b8e97;
      box-shadow:0 7px 15px rgba(56,59,67,.18);
    }

    .mark.done.selected{
      color:#fff;
      background:var(--accent);
      box-shadow:0 7px 18px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .status{
      margin-top:12px;
      min-height:16px;
      font-size:12px;
      color:#8b8e97;
      font-weight:700;
    }

    .footer{
      margin:22px 4px 0;
      color:#9498a2;
      font-size:12px;
      line-height:1.45;
      text-align:center;
    }

    .footer strong{color:#6f737d}

    @media (max-width:540px){
      .app{padding:18px 12px 34px}
      .header{align-items:flex-start}
      .today{font-size:12px;padding-top:5px}
      .summary{gap:7px}
      .summary-box{padding:12px 8px}
      .summary-num{font-size:21px}
      .summary-label{font-size:9px}
      .habit{padding:16px;border-radius:21px}
      .habit-title{font-size:17px}
      .streak-num{font-size:26px}
      .mark{width:44px;height:40px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <div class="eyebrow">Мои привычки</div>
        <h1>Серии</h1>
      </div>
      <div class="today" id="today"></div>
    </header>

    <section class="summary">
      <div class="summary-box">
        <div class="summary-num" id="doneToday">0</div>
        <div class="summary-label">сделано сегодня</div>
      </div>
      <div class="summary-box">
        <div class="summary-num" id="bestStreak">0</div>
        <div class="summary-label">лучшая серия</div>
      </div>
      <div class="summary-box">
        <div class="summary-num" id="activeCount">0</div>
        <div class="summary-label">активных серий</div>
      </div>
    </section>

    <section class="list" id="habitList"></section>

    <div class="footer">
      Данные хранятся <strong>только на этом устройстве и в этом браузере</strong>.<br>
      Для обычных привычек незаполненный прошедший день считается пропуском. Для тренировок серия сохраняется, пока между выполненными тренировками не прошло больше 7 дней.
    </div>
  </main>

<script>
(() => {
  const STORAGE_KEY = 'streakPage_v1';

  const habits = [
    { id:'warmup',   name:'Зарядка',          color:'#79D987', type:'daily'   },
    { id:'workout',  name:'Тренировки',       color:'#8B1E2D', type:'workout' },
    { id:'bible',    name:'Библия',           color:'#D4A017', type:'daily'   },
    { id:'book',     name:'2 страницы книги', color:'#377DFF', type:'daily'   },
    { id:'english',  name:'English',           color:'#C14DCE', type:'daily'   },
    { id:'serbian',  name:'Srpski',            color:'#4DBBEA', type:'daily'   },
    { id:'finance',  name:'Таблица Д/Р',       color:'#2E9B50', type:'daily'   },
    { id:'students', name:'Таблица учеников',  color:'#5C2D91', type:'daily'   },
    { id:'habits',   name:'Таблица привычек',  color:'#111111', type:'daily'   }
  ];

  const milestones = [
  { n:5,  emoji:'😎', title:'5 дней' },
  { n:10, emoji:'⚡', title:'10 дней' },
  { n:15, emoji:'🔥', title:'15 дней' },
  { n:21, emoji:'❤️‍🔥', title:'21 день' },
  { n:30, emoji:'🏆', title:'30 дней' },
  { n:45, emoji:'💎', title:'45 дней' },
  { n:66, emoji:'👑', title:'66 дней' }
];

  function emptyState(){
    return { version:1, log:{} };
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return emptyState();
      const parsed = JSON.parse(raw);
      return parsed && parsed.log ? parsed : emptyState();
    }catch(e){
      return emptyState();
    }
  }

  let state = load();

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function localDateKey(date = new Date()){
    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,'0');
    const d = String(date.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }

  function dateFromKey(key){
    const [y,m,d] = key.split('-').map(Number);
    return new Date(y, m-1, d, 12, 0, 0, 0);
  }

  function shiftDateKey(key, days){
    const dt = dateFromKey(key);
    dt.setDate(dt.getDate()+days);
    return localDateKey(dt);
  }

  function dayDiff(aKey, bKey){
    const a = dateFromKey(aKey);
    const b = dateFromKey(bKey);
    return Math.round((b-a)/86400000);
  }

  function getStatus(dateKey, habitId){
    return state.log?.[dateKey]?.[habitId] || null;
  }

  function setStatus(dateKey, habitId, status){
    if(!state.log[dateKey]) state.log[dateKey] = {};
    if(getStatus(dateKey, habitId) === status){
      delete state.log[dateKey][habitId];
      if(Object.keys(state.log[dateKey]).length === 0) delete state.log[dateKey];
    }else{
      state.log[dateKey][habitId] = status;
    }
    save();
    render();
  }

  function dailyStreak(habitId){
    const today = localDateKey();
    const todayStatus = getStatus(today, habitId);

    if(todayStatus === 'fail') return 0;

    let cursor = todayStatus === 'done' ? today : shiftDateKey(today, -1);
    let streak = 0;

    while(getStatus(cursor, habitId) === 'done'){
      streak++;
      cursor = shiftDateKey(cursor, -1);
    }
    return streak;
  }

  function allDoneDates(habitId){
    return Object.keys(state.log)
      .filter(k => getStatus(k, habitId) === 'done')
      .sort();
  }

  function workoutStreak(habitId){
    const today = localDateKey();
    const dates = allDoneDates(habitId);
    if(!dates.length) return 0;

    const last = dates[dates.length-1];

    // Раз в 7 дней допустимо: серия сбрасывается только после превышения 7 дней.
    if(dayDiff(last, today) > 7) return 0;

    let streak = 1;
    for(let i = dates.length-1; i > 0; i--){
      const newer = dates[i];
      const older = dates[i-1];
      if(dayDiff(older, newer) <= 7){
        streak++;
      }else{
        break;
      }
    }
    return streak;
  }

  function getStreak(habit){
    return habit.type === 'workout'
      ? workoutStreak(habit.id)
      : dailyStreak(habit.id);
  }

  function hexToRgb(hex){
    const c = hex.replace('#','');
    const v = c.length === 3
      ? c.split('').map(x=>x+x).join('')
      : c;
    return {
      r:parseInt(v.slice(0,2),16),
      g:parseInt(v.slice(2,4),16),
      b:parseInt(v.slice(4,6),16)
    };
  }

  function mixWithWhite(hex, intensity){
    // intensity 0..1; 0 -> grey, 1 -> full color.
    if(intensity <= 0) return '#B8BBC3';
    const {r,g,b} = hexToRgb(hex);
    const base = 246;
    const t = Math.min(1, Math.max(.18, .26 + intensity*.74));
    const rr = Math.round(base + (r-base)*t);
    const gg = Math.round(base + (g-base)*t);
    const bb = Math.round(base + (b-base)*t);
    return `rgb(${rr}, ${gg}, ${bb})`;
  }

  function habitMeta(habit){
    if(habit.type === 'workout'){
      const doneDates = allDoneDates(habit.id);
      if(!doneDates.length) return 'Серия по выполненным тренировкам';
      const last = doneDates[doneDates.length-1];
      const diff = dayDiff(last, localDateKey());
      if(diff === 0) return 'Тренировка отмечена сегодня';
      const left = Math.max(0, 7-diff);
      return `До сброса серии: ${left} дн.`;
    }
    return 'Ежедневная задача';
  }

  function pluralDays(n, workout=false){
    if(workout){
      const n10=n%10, n100=n%100;
      if(n10===1 && n100!==11) return 'тренировка';
      if([2,3,4].includes(n10) && ![12,13,14].includes(n100)) return 'тренировки';
      return 'тренировок';
    }
    const n10=n%10, n100=n%100;
    if(n10===1 && n100!==11) return 'день';
    if([2,3,4].includes(n10) && ![12,13,14].includes(n100)) return 'дня';
    return 'дней';
  }

  function statusText(habit, status, streak){
    if(status === 'done'){
      return habit.type === 'workout'
        ? 'Сегодняшняя тренировка засчитана.'
        : 'Сегодня выполнено — серия продолжается.';
    }
    if(status === 'fail'){
      return habit.type === 'workout'
        ? 'Сегодня отмечен пропуск. Тренировочная серия сохраняется до 7 дней от последнего выполнения.'
        : 'Сегодня отмечен пропуск — серия сброшена.';
    }
    if(streak === 0) return 'Сегодня пока ничего не отмечено.';
    return habit.type === 'workout'
      ? 'Сегодня можно отдыхать: тренировочная серия считается отдельно.'
      : 'Сегодня ещё не отмечено. До конца дня серия остаётся активной.';
  }

  function render(){
    const list = document.getElementById('habitList');
    const todayKey = localDateKey();

    const formatter = new Intl.DateTimeFormat('ru-RU', {
      weekday:'long', day:'numeric', month:'long'
    });
    document.getElementById('today').textContent =
      formatter.format(new Date()).replace(/^./, c => c.toUpperCase());

    let doneToday = 0;
    let best = 0;
    let active = 0;

    list.innerHTML = '';

    habits.forEach(habit => {
      const streak = getStreak(habit);
      const status = getStatus(todayKey, habit.id);
      if(status === 'done') doneToday++;
      if(streak > best) best = streak;
      if(streak > 0) active++;

      const progress = Math.min(streak, 21) / 21;
      const accent = streak > 0 ? mixWithWhite(habit.color, progress) : '#B8BBC3';

      const card = document.createElement('article');
      card.className = `habit ${streak>0 ? 'active':''}`;
      card.style.setProperty('--full', habit.color);
      card.style.setProperty('--accent', accent);

      card.innerHTML = `
        <div class="top-row">
          <div class="title-wrap">
            <div class="habit-title">
              <span class="dot"></span>
              <span>${habit.name}</span>
            </div>
            <div class="meta">${habitMeta(habit)}</div>
          </div>
          <div class="streak">
            <div class="streak-num">${streak}</div>
            <div class="streak-label">${pluralDays(streak, habit.type==='workout')}</div>
          </div>
        </div>

        <div class="bar-track" aria-label="Прогресс серии">
          <div class="bar" style="width:${progress*100}%"></div>
        </div>

        <div class="below">
          <div class="badges">
            ${milestones.map(m => `
              <span class="badge ${streak>=m.n ? 'on':''}" title="${m.title}">
                ${m.emoji}
              </span>`).join('')}
          </div>

          <div class="actions">
            <button class="mark fail ${status==='fail'?'selected':''}"
                    data-id="${habit.id}" data-status="fail"
                    aria-label="Не выполнено">✕</button>
            <button class="mark done ${status==='done'?'selected':''}"
                    data-id="${habit.id}" data-status="done"
                    aria-label="Выполнено">✓</button>
          </div>
        </div>

        <div class="status">${statusText(habit, status, streak)}</div>
      `;

      list.appendChild(card);
    });

    document.getElementById('doneToday').textContent = doneToday;
    document.getElementById('bestStreak').textContent = best;
    document.getElementById('activeCount').textContent = active;

    document.querySelectorAll('.mark').forEach(btn => {
      btn.addEventListener('click', () => {
        setStatus(todayKey, btn.dataset.id, btn.dataset.status);
      });
    });
  }

  // Перерисовать после возвращения на вкладку, чтобы корректно сменился день.
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) render();
  });

  // И дополнительно проверять смену дня раз в минуту, если страница открыта постоянно.
  let lastDay = localDateKey();
  setInterval(() => {
    const nowDay = localDateKey();
    if(nowDay !== lastDay){
      lastDay = nowDay;
      render();
    }
  }, 60000);

  render();
})();
</script>
</body>
</html>
